<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="1B.css">
</head>
<body>
    <div class="container">
        <h1>Class Timetable</h1>
        <table border="2px" id="table1">
        <thead>
                <tr class="classifier">
                    <th>Day</th>
                    <th>10:00-11:00</th>
                    <th>11:00-12:00</th>
                    <th>12:00-1:00</th>
                    <th>1:00-2:00</th>
                    <th>2:00-3:00</th>
                    <th>3:00-4:00</th>
                    <th>4:00-5:00</th>
                </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>DS</td>
                <td>FOME</td>
                <td rowspan="3">RECESS</td>
                <td colspan="2">DS PRACTICAL</td>
                <td>CL</td>
                <td>REMEDIAL</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>DMPT</td>
                <td>CAO</td>
                <td colspan="2">WT PRACTICAL</td>
                <td colspan="2">SPORTS</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>DS</td>
                <td>CAO</td>
                <td>DMPT</td>
                <td>CL</td>
                <td colspan="2">HELP DESK</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>DMPT</td>
                <td>CAO</td>
                <td>DS</td>
                <td>RECESS</td>
                <td>MDM</td>
                <td>FOME</td>
                <td>LIBRARY</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>CL</td>
                <td>CAO</td>
                <td>DMPT</td>
                <td>RECESS</td>
                <td>MDM</td>
                <td>DS</td>
                <td>FOME</td>
            </tr>
        </tbody>
        </table>
    </div>
</body>
</html>
